<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOKI FISH-IT LANGGZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#070b10;
    --bg-panel:#0f161d;
    --bg-panel-2:#172029;
    --line:#23303a;
    --accent:#ff7a29;
    --accent-dim:#c85f1f;
    --teal:#34d9c4;
    --gold:#f2c14e;
    --text:#eaf1f5;
    --text-dim:#8a99a6;
    --radius:16px;
    --maxw:480px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
  }
  #app-shell{
    width:100%;
    max-width:var(--maxw);
    min-height:100vh;
    background:
      radial-gradient(ellipse 600px 300px at 50% -10%, rgba(255,122,41,0.10), transparent 60%),
      radial-gradient(ellipse 500px 260px at 100% 20%, rgba(52,217,196,0.06), transparent 60%),
      var(--bg);
    position:relative;
    padding-bottom:84px;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:16px 18px 10px;
  }
  .topbar .logo{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(145deg,var(--accent),#c94f0f);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;flex-shrink:0;
    box-shadow:0 4px 14px rgba(255,122,41,0.35);
  }
  .topbar .brand{font-family:'Anton',sans-serif;letter-spacing:0.5px;font-size:15px;line-height:1.1;}
  .topbar .brand span{display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--teal);letter-spacing:1.5px;font-weight:500;margin-top:2px;}
  .topbar .back{
    display:flex;align-items:center;gap:6px;
    font-size:12.5px;color:var(--text-dim);
    background:var(--bg-panel);border:1px solid var(--line);
    padding:7px 12px;border-radius:100px;
  }
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .hamburger{
    width:34px;height:34px;border-radius:10px;flex-shrink:0;
    background:var(--bg-panel);border:1px solid var(--line);
    color:var(--text);font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .hamburger:active{border-color:var(--accent-dim);}

  /* ---------- Side drawer ---------- */
  .drawer-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);
    opacity:0;pointer-events:none;transition:opacity .25s ease;
    z-index:60;
  }
  .drawer-overlay.open{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;
    width:78%;max-width:300px;
    background:var(--bg-panel);border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform .28s ease;
    z-index:61;display:flex;flex-direction:column;
    padding:18px 16px;overflow-y:auto;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{display:flex;align-items:center;gap:10px;padding-bottom:16px;margin-bottom:10px;border-bottom:1px solid var(--line);}
  .drawer-logo{width:34px;height:34px;border-radius:9px;flex-shrink:0;background:linear-gradient(145deg,var(--accent),#c94f0f);display:flex;align-items:center;justify-content:center;font-size:16px;}
  .drawer-brand{font-family:'Anton',sans-serif;font-size:15px;flex:1;}
  .drawer-close{background:none;border:none;color:var(--text-dim);font-size:17px;padding:4px;}
  .drawer-list{display:flex;flex-direction:column;gap:3px;}
  .drawer-item{
    display:flex;align-items:center;gap:12px;
    padding:12px 10px;border-radius:12px;
    font-size:13.5px;font-weight:600;color:var(--text);
  }
  .drawer-item:active{background:var(--bg-panel-2);}
  .drawer-item .di-ic{font-size:17px;width:22px;text-align:center;flex-shrink:0;}
  .drawer-item .di-badge{margin-left:auto;background:var(--accent);color:#1a0d02;font-size:9.5px;font-weight:800;border-radius:100px;padding:1px 7px;}
  .drawer-foot{border-top:1px solid var(--line);padding-top:10px;margin-top:12px;display:flex;flex-direction:column;gap:3px;}

  /* ---------- Depth rail (signature element) ---------- */
  .depth-rail{
    display:flex;align-items:center;gap:8px;
    padding:2px 18px 14px;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;color:var(--text-dim);
    letter-spacing:0.5px;
  }
  .depth-rail .dot{width:5px;height:5px;border-radius:50%;background:var(--line);flex-shrink:0;}
  .depth-rail .dot.active{background:var(--accent);box-shadow:0 0 0 3px rgba(255,122,41,0.18);}
  .depth-rail .seg{flex:1;height:1px;background:var(--line);}
  .depth-rail .label{white-space:nowrap;}
  .depth-rail .label.active{color:var(--accent);}

  /* ---------- Hero ---------- */
  .hero{
    margin:4px 18px 22px;
    border-radius:22px;
    padding:26px 20px 22px;
    position:relative;
    overflow:hidden;
    background:
      linear-gradient(180deg, rgba(7,11,16,0) 0%, rgba(7,11,16,0.85) 100%),
      linear-gradient(135deg,#0e2a2a 0%, #12181f 55%, #1c1109 100%);
    border:1px solid var(--line);
  }
  .hero .ripple{
    position:absolute;inset:0;
    background-image:repeating-radial-gradient(circle at 85% 20%, rgba(52,217,196,0.10) 0, rgba(52,217,196,0.10) 1px, transparent 2px, transparent 26px);
    opacity:0.5;pointer-events:none;
  }
  .hero .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--teal);
    letter-spacing:2px;text-transform:uppercase;position:relative;
  }
  .hero h1{
    font-family:'Anton',sans-serif;
    font-size:34px;line-height:1.02;
    margin:8px 0 4px;letter-spacing:0.3px;
    position:relative;
    text-shadow:0 2px 20px rgba(0,0,0,0.4);
  }
  .hero h1 .hl{color:var(--accent);}
  .hero p{
    font-size:13px;color:var(--text-dim);max-width:88%;margin:0 0 16px;position:relative;
  }
  .hero .cta-row{display:flex;gap:8px;position:relative;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:11px 18px;border-radius:100px;
    font-weight:700;font-size:13px;border:none;
  }
  .btn-primary{background:var(--accent);color:#1a0d02;box-shadow:0 8px 20px -6px rgba(255,122,41,0.55);}
  .btn-ghost{background:rgba(255,255,255,0.04);color:var(--text);border:1px solid var(--line);}
  .btn:active{transform:scale(0.97);}

  /* ---------- Section heading ---------- */
  .section{padding:2px 18px 26px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .section-head h2{font-family:'Anton',sans-serif;font-size:19px;letter-spacing:0.3px;margin:0;}
  .section-head .sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .section-head .tag{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);border:1px solid var(--accent-dim);padding:3px 9px;border-radius:100px;}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tab{
    flex:1;text-align:center;padding:11px 0;border-radius:100px;
    background:var(--bg-panel);border:1px solid var(--line);
    font-size:12.5px;font-weight:700;color:var(--text-dim);
  }
  .tab.active{background:var(--accent);border-color:var(--accent);color:#1a0d02;}

  /* ---------- Category / product cards ---------- */
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .cat-card{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 14px;position:relative;overflow:hidden;
    transition:border-color .15s;
  }
  .cat-card:active{border-color:var(--accent-dim);}
  .cat-card .icon{font-size:26px;margin-bottom:10px;display:block;}
  .cat-card h3{font-size:13.5px;margin:0 0 4px;font-weight:800;line-height:1.2;}
  .cat-card p{font-size:11px;color:var(--text-dim);margin:0 0 10px;line-height:1.4;min-height:30px;}
  .cat-card .from{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--teal);}
  .cat-card .from b{color:var(--text);font-size:12px;}

  .list-item{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-bottom:10px;
  }
  .list-item .icon{
    width:42px;height:42px;border-radius:10px;flex-shrink:0;
    background:var(--bg-panel-2);display:flex;align-items:center;justify-content:center;font-size:19px;
  }
  .list-item .info{flex:1;min-width:0;}
  .list-item .info h4{margin:0 0 2px;font-size:13.5px;font-weight:700;}
  .list-item .info p{margin:0;font-size:10.5px;color:var(--text-dim);}
  .list-item .price{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--accent);font-weight:600;white-space:nowrap;}

  /* ---------- Variant picker ---------- */
  .variant{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:10px;
  }
  .variant.selected{border-color:var(--accent);background:linear-gradient(135deg, rgba(255,122,41,0.10), rgba(255,122,41,0.02));}
  .variant .vname{font-size:13.5px;font-weight:700;margin:0 0 3px;}
  .variant .vdesc{font-size:10.5px;color:var(--text-dim);margin:0;}
  .variant .vprice{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);font-weight:700;white-space:nowrap;}
  .radio{
    width:19px;height:19px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .variant.selected .radio{border-color:var(--accent);}
  .variant.selected .radio::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--accent);}

  .qty-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:14px 0;}
  .qty-row .lbl{font-size:12.5px;color:var(--text-dim);}
  .qty-ctrl{display:flex;align-items:center;gap:14px;}
  .qty-ctrl button{width:28px;height:28px;border-radius:8px;background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);font-size:15px;line-height:1;}
  .qty-ctrl span{font-family:'JetBrains Mono',monospace;font-size:14px;min-width:16px;text-align:center;}

  /* ---------- Forms ---------- */
  .field{margin-bottom:14px;}
  .field label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-dim);margin-bottom:7px;}
  .field label .req{color:var(--accent);}
  .field input, .field textarea, .field select{
    width:100%;background:var(--bg-panel);border:1px solid var(--line);
    color:var(--text);border-radius:12px;padding:12px 14px;font-size:13px;font-family:inherit;
    outline:none;
  }
  .field input:focus, .field textarea:focus{border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:70px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .login-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .login-opt{
    text-align:center;padding:11px 0;border-radius:12px;background:var(--bg-panel);
    border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--text-dim);
  }
  .login-opt.selected{border-color:var(--teal);color:var(--teal);background:rgba(52,217,196,0.08);}

  .note-box{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;font-size:11.5px;color:var(--text-dim);line-height:1.7;margin-bottom:16px;
  }
  .note-box b{color:var(--text);}
  .note-box ul{margin:6px 0 0;padding-left:16px;}

  .badge-row{display:flex;gap:8px;margin-bottom:18px;}
  .badge{flex:1;background:var(--bg-panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;font-size:10px;color:var(--text-dim);}
  .badge .bi{font-size:16px;display:block;margin-bottom:4px;}

  /* ---------- Summary ---------- */
  .summary-card{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .summary-card .head{display:flex;gap:10px;align-items:center;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line);}
  .summary-card .head .icon{width:40px;height:40px;border-radius:10px;background:var(--bg-panel-2);display:flex;align-items:center;justify-content:center;font-size:18px;}
  .summary-card .head h4{margin:0;font-size:13.5px;}
  .summary-card .head p{margin:2px 0 0;font-size:10.5px;color:var(--text-dim);}
  .row{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;color:var(--text-dim);}
  .row b{color:var(--text);font-weight:600;font-family:'JetBrains Mono',monospace;font-size:12px;}
  .row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:13px;}
  .row.total b{color:var(--accent);font-size:16px;}
  .empty-hint{text-align:center;padding:30px 10px;color:var(--text-dim);font-size:12.5px;}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:var(--maxw);
    background:rgba(15,22,29,0.92);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex;
  }
  .bottomnav a{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:11px 0 9px;font-size:10px;color:var(--text-dim);font-weight:600;
  }
  .bottomnav a.active{color:var(--accent);}
  .bottomnav a .ic{font-size:18px;}
  .cart-dot{position:relative;}
  .cart-dot .n{position:absolute;top:-4px;right:6px;background:var(--accent);color:#1a0d02;font-size:8.5px;font-weight:800;border-radius:100px;padding:1px 4px;min-width:13px;}

  .sticky-cta{position:sticky;bottom:0;padding:14px 0 4px;background:linear-gradient(180deg, transparent, var(--bg) 30%);}
  .sticky-cta .btn{width:100%;justify-content:center;padding:14px 0;font-size:14px;}
  .sticky-cta .btn[disabled]{opacity:0.4;pointer-events:none;}

  ::-webkit-scrollbar{display:none;}

  /* ---------- Gate (login) ---------- */
  .gate-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:26px;text-align:center;}
  .gate-wrap .logo-big{width:64px;height:64px;border-radius:18px;margin:0 auto 18px;background:linear-gradient(145deg,var(--accent),#c94f0f);display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 10px 26px -6px rgba(255,122,41,0.5);}
  .gate-wrap h1{font-family:'Anton',sans-serif;font-size:26px;margin:0 0 6px;}
  .gate-wrap p{font-size:12.5px;color:var(--text-dim);margin:0 0 26px;}
  #gsi-btn-wrap{display:flex;justify-content:center;margin-bottom:14px;min-height:44px;}
  .fallback-note{font-size:10.5px;color:var(--text-dim);margin-bottom:10px;}
  .glogin-fallback{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;}
  .glogin-fallback .g-icon{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;color:#4285F4;font-size:16px;margin:0 auto 10px;}

  /* ---------- Admin ---------- */
  .admin-topbar{display:flex;align-items:center;gap:8px;padding:16px 18px;border-bottom:1px solid var(--line);margin-bottom:4px;}
  .admin-topbar h2{font-family:'Anton',sans-serif;font-size:16px;margin:0;}
  .admin-topbar .pill{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9.5px;background:rgba(52,217,196,0.12);color:var(--teal);padding:4px 9px;border-radius:100px;}
  .admin-actions{display:flex;gap:8px;padding:14px 18px 6px;}
  .admin-actions .btn{flex:1;justify-content:center;padding:10px 0;font-size:11.5px;}
  .admin-row{display:flex;align-items:center;gap:10px;background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;}
  .admin-row .icon{width:38px;height:38px;border-radius:9px;background:var(--bg-panel-2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .admin-row .info{flex:1;min-width:0;}
  .admin-row .info h4{margin:0 0 2px;font-size:13px;}
  .admin-row .info p{margin:0;font-size:10px;color:var(--text-dim);}
  .admin-row .acts{display:flex;gap:6px;}
  .admin-row .acts button{width:30px;height:30px;border-radius:8px;background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);font-size:13px;}
  .variant-edit-row{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;}
  .variant-edit-row .ve-top{display:flex;gap:8px;margin-bottom:6px;}
  .variant-edit-row input{margin-bottom:6px;}
  .variant-edit-row .ve-remove{width:100%;text-align:center;font-size:10.5px;color:var(--accent);background:none;border:none;padding:4px;}
  .group-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .group-toggle .opt{flex:1;text-align:center;padding:10px 0;border-radius:12px;background:var(--bg-panel);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--text-dim);}
  .group-toggle .opt.selected{border-color:var(--accent);color:var(--accent);background:rgba(255,122,41,0.08);}
  .user-chip{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:10.5px;color:var(--text-dim);background:var(--bg-panel);border:1px solid var(--line);padding:5px 10px 5px 5px;border-radius:100px;}
  .user-chip .av{width:20px;height:20px;border-radius:50%;background:var(--teal);color:#04201c;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;}
  .admin-link-footer{text-align:center;padding:6px 0 20px;}
  .admin-link-footer a{font-size:10px;color:var(--line);text-decoration:underline;}
</style>
</head>
<body>
<div id="app-shell">
  <div id="app"></div>
  <nav class="bottomnav" id="bottomnav"></nav>
  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
  <aside class="drawer" id="drawer"></aside>
</div>

// ---- Sesi Login (biar nggak login ulang tiap buka, tahan sampai 5 jam / walau tanpa sinyal) ----
const SESSION_KEY = "fishitlanggz_session_v1";
const SESSION_DURATION_MS = 5 * 60 * 60 * 1000; // 5 jam
function saveSession(){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({ user: state.user, expires: Date.now() + SESSION_DURATION_MS })); }
  catch(e){ /* browser block storage, ya sudah, login manual tiap buka */ }
}
function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!data.expires || Date.now() > data.expires){ localStorage.removeItem(SESSION_KEY); return null; }
    return data.user || null;
  }catch(e){ return null; }
}
function logoutUser(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  state.user = null;
  go('gate');
}

const CONFIG_KEY = "fishitlanggz_config_v1";
function autoSaveConfig(){
  try{ localStorage.setItem(CONFIG_KEY, JSON.stringify({ catalog: CATALOG_ITEMS, testimonials: state.testimonials, links: LINK_ITEMS, savedAt: Date.now() })); }
  catch(e){ /* storage penuh/diblokir, ya sudah, tetap ada tombol Export manual */ }
}
function autoLoadConfig(){
  try{
    const raw = localStorage.getItem(CONFIG_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    if(data && Array.isArray(data.catalog) && data.catalog.length){
      CATALOG_ITEMS = data.catalog;
      state.testimonials = Array.isArray(data.testimonials) ? data.testimonials : [];
      LINK_ITEMS = Array.isArray(data.links) ? data.links : LINK_ITEMS;
    }
  }catch(e){ /* biarin pakai data default kalau gagal baca */ }
}

function fmt(n){ return "Rp " + n.toLocaleString("id-ID"); }
function cartTotal(){ return state.cart.reduce((s,c)=>s+c.price*c.qty,0); }
function cartCount(){ return state.cart.reduce((s,c)=>s+c.qty,0); }
function findItem(id){
  return CATALOG_ITEMS.find(i=>i.id===id) || null;
}
function go(route, extra){
  state.route = route;
  if(extra) Object.assign(state, extra);
  render();
  window.scrollTo(0,0);
}

/* ====================== RENDER PIECES ====================== */
function depthRail(){
  const idx = DEPTH_STEPS.indexOf(state.route);
  return `<div class="depth-rail">
    ${DEPTH_STEPS.map((s,i)=>`
      <span class="dot ${i<=idx?'active':''}"></span>
      ${i<DEPTH_STEPS.length-1?'<span class="seg"></span>':''}
    `).join('')}
  </div>
  <div class="depth-rail" style="padding-top:0;margin-top:-10px;">
    <span class="label ${idx===0?'active':''}">${DEPTH_LABEL.home} permukaan</span>
    <span class="seg"></span>
    <span class="label" style="margin-left:auto;">dasar laut ${DEPTH_LABEL.ringkasan}</span>
  </div>`;
}

function topbar(showBack, backRoute, backLabel){
  const initial = state.user ? state.user.name.trim().charAt(0).toUpperCase() : '';
  return `<div class="topbar">
    <div class="logo">🎣</div>
    <div class="brand">${BRAND.short}<span>JOKI &amp; JUALAN FISHIT</span></div>
    <div class="topbar-right">
      ${showBack? `<a class="back" href="#" onclick="go('${backRoute}');return false;">← ${backLabel}</a>`:''}
      ${(!showBack && state.user) ? `<div class="user-chip"><span class="av">${initial}</span>${state.user.name.split(' ')[0]}<a href="#" onclick="logoutUser();return false;" style="color:var(--text-dim);margin-left:2px;">✕</a></div>`:''}
      <button class="hamburger" onclick="toggleDrawer();return false;">☰</button>
    </div>
  </div>`;
}

function bottomNav(){
  const items = [
    {r:"home", ic:"🏠", label:"Beranda"},
    {r:"katalog", ic:"🗂️", label:"Katalog"},
    {r:"ringkasan", ic:"🧾", label:"Keranjang", cart:true},
    {r:"kontak", ic:"💬", label:"Kontak"},
  ];
  document.getElementById('bottomnav').innerHTML = items.map(it=>{
    const activeRoutes = it.r==="katalog" ? ["katalog","produk"] : it.r==="ringkasan" ? ["ringkasan","checkout"] : [it.r];
    const active = activeRoutes.includes(state.route);
    return `<a href="#" class="${active?'active':''}" onclick="go('${it.r==='ringkasan'?'ringkasan':it.r}');return false;">
      <span class="ic ${it.cart?'cart-dot':''}">${it.ic}${it.cart&&cartCount()>0?`<span class="n">${cartCount()}</span>`:''}</span>
      ${it.label}
    </a>`;
  }).join('');
}

function handleProofUpload(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{ state.proofImage = e.target.result; render(); };
  reader.readAsDataURL(file);
}
function sendProofToWhatsapp(){
  const msg = `Halo min, saya *${state.user?state.user.name:''}* sudah bayar via *${state.payment}* untuk pesanan:%0a`+
    state.cart.map(c=>`• ${c.itemTitle} - ${c.variantName} x${c.qty}`).join('%0a')+
    `%0a%0aTotal: ${fmt(cartTotal())}%0a(Bukti transfer akan saya lampirkan di chat ini, mohon dicek ya min 🙏)`;
  window.open(`https://wa.me/${BRAND.wa}?text=${msg}`, '_blank');
}

function renderGoogleButton(){
  const wrap = document.getElementById('gsi-btn-wrap');
  const fb = document.getElementById('gate-fallback');
  if(!wrap) return;
  try{
    if(window.google && window.google.accounts && window.google.accounts.id && !GOOGLE_CLIENT_ID.startsWith("PASTE_")){
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential });
      google.accounts.id.renderButton(wrap, { theme:"filled_black", size:"large", shape:"pill", width:240 });
      fb.innerHTML = "";
      return;
    }
  }catch(e){ /* fallback di bawah */ }
  wrap.innerHTML = "";
  fb.innerHTML = `
    <div class="fallback-note">⚠️ Login Google asli belum dikonfigurasi (butuh Client ID + domain resmi). Mode simulasi aktif untuk sekarang:</div>
    <div class="glogin-fallback">
      <div class="g-icon">G</div>
      <div class="field"><label>Nama</label><input placeholder="Nama kamu" value="${state.fallbackName}" oninput="state.fallbackName=this.value"></div>
      <div class="field"><label>Email</label><input placeholder="you@gmail.com" value="${state.fallbackEmail}" oninput="state.fallbackEmail=this.value"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="loginFallback()">Lanjutkan (simulasi Google)</button>
    </div>
  `;
}
function handleGoogleCredential(resp){
  try{
    const payload = JSON.parse(decodeURIComponent(escape(atob(resp.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));
    state.user = { name: payload.name || payload.email, email: payload.email };
  }catch(e){
    state.user = { name:"User Google", email:"" };
  }
  saveSession();
  go('home');
}
function loginFallback(){
  if(!state.fallbackName || !state.fallbackEmail){ alert('Isi nama & email dulu ya.'); return; }
  if(!/^[^\s@]+@gmail\.com$/i.test(state.fallbackEmail.trim())){
    alert('Email harus format Gmail asli, contoh: namakamu@gmail.com');
    return;
  }
  state.user = { name: state.fallbackName, email: state.fallbackEmail };
  saveSession();
  go('home');
}

function slugify(s){ return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || ('item-'+Date.now()); }
function saveAdminDraft(){
  const d = state.adminDraft;
  if(!d.title || d.variants.some(v=>!v.name)){ alert('Judul & nama tiap paket wajib diisi.'); return; }
  if(state.adminEditId==='new'){
    d.id = slugify(d.title);
    CATALOG_ITEMS.push(d);
  } else {
    const idx = CATALOG_ITEMS.findIndex(i=>i.id===state.adminEditId);
    CATALOG_ITEMS[idx] = d;
  }
  autoSaveConfig();
  go('admin');
}
function exportConfig(){
  const payload = { catalog: CATALOG_ITEMS, testimonials: state.testimonials, links: LINK_ITEMS };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `fishit-langgz-backup-${stamp}.json`; a.click();
  URL.revokeObjectURL(url);
}
function importConfig(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(Array.isArray(parsed)){
        // format lama (cuma katalog)
        CATALOG_ITEMS = parsed;
      } else if(parsed && Array.isArray(parsed.catalog)){
        CATALOG_ITEMS = parsed.catalog;
        state.testimonials = Array.isArray(parsed.testimonials) ? parsed.testimonials : [];
        LINK_ITEMS = Array.isArray(parsed.links) ? parsed.links : LINK_ITEMS;
      } else {
        throw new Error('format salah');
      }
      alert('Config berhasil dimuat.');
      autoSaveConfig();
      go('admin');
    }catch(err){ alert('Gagal import: file JSON tidak valid.'); }
  };
  reader.readAsText(file);
}

  state.cart.forEach(c=>{
